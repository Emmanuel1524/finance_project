[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wdo"
version = "0.1.0"
description = "Backtest/replay do robô de abertura do WDO (B3), espelhando o EA MQL5 v1.35"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "outputs/.pytest_cache"
